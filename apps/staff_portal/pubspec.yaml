name: staff_portal
description: Staff/Owner Management Portal — first app in the RMS Flutter monorepo.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation & state management
  go_router: "^14.6.1"
  flutter_bloc: "^8.1.6"

  # Payments
  razorpay_flutter: "^1.3.7"
  web: "^1.1.1"

  # Printing
  printing: "^5.13.2"
  pdf: "^3.11.1"

  # Charts
  fl_chart: "^0.69.0"

  # QR code display
  qr_flutter: "^4.1.0"

  # File picking for bulk uploads
  file_picker: "^8.1.4"

  # Connectivity
  connectivity_plus: "^6.1.1"

  # Internal monorepo packages
  models:
    path: ../../packages/models
  api_client:
    path: ../../packages/api_client
  auth:
    path: ../../packages/auth
  core_ui:
    path: ../../packages/core_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: "^4.0.0"
  bloc_test: "^9.1.7"
  mocktail: "^1.0.4"
  build_runner: "^2.4.13"

flutter:
  uses-material-design: true
  generate: true  # enables l10n code generation
